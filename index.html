<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro Master v12</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #6366f1; --success: #10b981; --danger: #f43f5e; --bg: #0f172a; }
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; max-width: 500px; background: #1e293b; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px #000; }
        .upload { border: 2px dashed #334155; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 10px; position: relative; }
        .upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        select { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 10px; margin: 5px 0; outline: none; }
        .preview { font-size: 11px; color: #fbbf24; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 5px; margin-bottom: 10px; display: none; text-align: left; direction: ltr; }
        .btn { background: var(--primary); color: #fff; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .log { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 10px; margin-top: 15px; min-height: 80px; text-align: left; direction: ltr; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; font-size:20px; color:var(--primary)">Excel Multi-Tool v12</h2>
    
    <!-- فایل اول -->
    <div class="upload">📁 انتخاب فایل اول (پایه)<input type="file" id="fA"></div>
    <select id="sA" style="display:none"></select>
    <div id="pA" class="preview"></div>

    <!-- فایل دوم -->
    <div class="upload">📁 انتخاب فایل دوم (مرجع)<input type="file" id="fB"></div>
    <select id="sB" style="display:none"></select>
    <div id="pB" class="preview"></div>

    <span style="font-size:11px; color:var(--primary)">ستون شماره موبایل در فایل دوم:</span>
    <select id="sP" style="display:none"></select>

    <button id="go" class="btn" style="display:none">🧬 شروع ادغام نهایی</button>
    <div id="log" class="log">منتظر فایل‌ها...</div>
</div>

<script>
    let dA, dB;

    function cleanPhone(v) {
        if (!v) return null;
        let s = String(v).replace(/\D/g, '');
        if (s.length < 10) return null;
        return '0' + s.slice(-10);
    }

    // پاکسازی کلید: حذف هر چیزی که عدد نیست
    function cleanKey(v) {
        if (!v) return "";
        let s = String(v).replace(/\D/g, ''); 
        return s;
    }

    async function load(e, type) {
        const f = e.target.files[0];
        const wb = XLSX.read(await f.arrayBuffer());
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
        
        if (type == 'A') {
            dA = json; setupSelect('sA', json, 'pA');
        } else {
            dB = json; setupSelect('sB', json, 'pB'); setupSelect('sP', json);
        }
        if (dA && dB) document.getElementById('go').style.display = 'block';
        document.getElementById('log').innerText = `فایل ${type} لود شد.`;
    }

    function setupSelect(id, data, previewId) {
        const s = document.getElementById(id);
        s.style.display = 'block';
        s.innerHTML = '<option value="">انتخاب ستون...</option>';
        data[0].forEach((n, i) => s.innerHTML += `<option value="${i}">${n || 'ستون '+i}</option>`);

        if (previewId) {
            s.onchange = () => {
                const idx = s.value;
                if (!idx) return;
                // پیدا کردن اولین ردیف‌های غیر خالی برای نمایش
                let samples = [];
                for(let j=1; j<data.length && samples.length<3; j++) {
                    if(data[j][idx]) samples.push(cleanKey(data[j][idx]));
                }
                const p = document.getElementById(previewId);
                p.innerText = "نمونه (فقط اعداد): " + samples.join(' | ');
                p.style.display = 'block';
            };
        }
    }

    document.getElementById('fA').onchange = (e) => load(e, 'A');
    document.getElementById('fB').onchange = (e) => load(e, 'B');

    document.getElementById('go').onclick = () => {
        const kA = document.getElementById('sA').value, kB = document.getElementById('sB').value, pB = document.getElementById('sP').value;
        const log = document.getElementById('log');
        log.innerText = "در حال پردازش...";

        setTimeout(() => {
            try {
                const mapB = new Map();
                const hB = dB[0];
                const keepB = hB.map((n, i) => (i != kB && String(n).trim() !== "ردیف") ? i : -1).filter(i => i !== -1);

                dB.slice(1).forEach(row => {
                    const phone = cleanPhone(row[pB]);
                    const key = cleanKey(row[kB]);
                    if (key && phone) {
                        const cleanR = [...row];
                        cleanR[pB] = phone;
                        mapB.set(key, cleanR);
                    }
                });

                const hA = dA[0];
                const result = [[...hA, ...keepB.map(i => hB[i])]];
                let found = 0;

                dA.slice(1).forEach(rowA => {
                    const keyA = cleanKey(rowA[kA]);
                    const match = mapB.get(keyA);
                    if (match) {
                        const base = Array.from({length: hA.length}, (_, i) => rowA[i] || "");
                        result.push([...base, ...keepB.map(i => match[i])]);
                        found++;
                    }
                });

                if (found > 0) {
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(result), "Result");
                    XLSX.writeFile(wb, "Merged_Data.xlsx");
                    log.innerText = `✅ موفقیت‌آمیز! ${found} ردیف ادغام شد.`;
                } else {
                    log.innerHTML = `❌ خطا: تطابقی یافت نشد.<br>کلید فایل ۱: ${cleanKey(dA[1][kA])}<br>کلید فایل ۲: ${cleanKey(dB[1][kB])}`;
                }
            } catch (err) { log.innerText = "خطا در پردازش: " + err.message; }
        }, 100);
    };
</script>
</body>
</html>
