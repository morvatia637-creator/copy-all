<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro Copy - نسخه هوشمند</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #6366f1; --success: #22c55e; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .app-card { background: var(--card); width: 100%; max-width: 450px; border-radius: 24px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-size: 22px; margin-bottom: 5px; background: linear-gradient(to left, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .upload-area { border: 2px dashed #475569; border-radius: 16px; padding: 20px; cursor: pointer; position: relative; margin: 20px 0; }
        input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        select { width: 100%; padding: 12px; background: #334155; border: 1px solid #475569; color: white; border-radius: 12px; margin: 10px 0; outline: none; }
        .progress-container { background: #334155; height: 10px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(to right, #6366f1, #a855f7); transition: 0.5s; }
        .main-btn { background: linear-gradient(135deg, #4f46e5, #9333ea); color: white; border: none; width: 100%; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .main-btn:active { transform: scale(0.98); }
        .main-btn.copied { background: var(--success); }
        .reset-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 8px 15px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-top: 20px; }
        .preview-box { background: #0f172a; border-radius: 12px; padding: 10px; font-size: 11px; color: #64748b; text-align: left; margin-top: 15px; border-left: 3px solid var(--primary); }
        .resume-alert { background: #374151; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 15px; border: 1px solid var(--primary); display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <h1>Excel Pro Copy v2</h1>
    
    <div id="resumeAlert" class="resume-alert">
        ⏳ شما قبلاً تا ردیف <span id="savedRow">0</span> پیش رفته بودید. فایل را آپلود کنید تا ادامه دهیم.
    </div>

    <div class="upload-area">
        <span id="fileName">📁 انتخاب فایل اکسل</span>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <div id="selectionStep" style="display:none;">
        <select id="columnSelect"></select>
    </div>

    <div id="controlPanel" style="display:none; margin-top: 20px;">
        <div style="display:flex; justify-content: space-between; font-size: 12px; color: #94a3b8;">
            <span id="progressText">بخش ۱</span>
            <span id="totalRowsText">کل: ۰</span>
        </div>
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <button class="main-btn" id="copyBtn">کپی ۷۰۰۰ تای اول</button>
        <div class="preview-box" id="preview">در انتظار کپی...</div>
        <button class="reset-btn" id="resetBtn">پاکسازی حافظه و شروع مجدد</button>
    </div>
</div>

<script>
    let rows = [];
    let currentIndex = 0;
    const CHUNK_SIZE = 7000;

    // بارگذاری وضعیت قبلی از حافظه مرورگر
    window.onload = () => {
        const saved = localStorage.getItem('excel_index');
        if (saved && parseInt(saved) > 0) {
            document.getElementById('resumeAlert').style.display = 'block';
            document.getElementById('savedRow').innerText = saved;
            currentIndex = parseInt(saved);
        }
    };

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileName').innerText = file.name;
        
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {header: 1});
        
        window.fullData = json;
        const headers = json[0];
        const select = document.getElementById('columnSelect');
        select.innerHTML = '<option value="">--- انتخاب ستون هدف ---</option>';
        headers.forEach((h, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = h || `ستون ${i+1}`;
            select.appendChild(opt);
        });
        document.getElementById('selectionStep').style.display = 'block';
    });

    document.getElementById('columnSelect').addEventListener('change', function() {
        const colIdx = this.value;
        if (colIdx === "") return;

        rows = window.fullData.slice(1).map(r => r[colIdx]).filter(c => c !== undefined && c !== "");
        
        // اگر ردیف ذخیره شده بیشتر از تعداد ردیف‌های فایل جدید باشد، صفرش کن
        if (currentIndex >= rows.length) currentIndex = 0;

        document.getElementById('totalRowsText').innerText = `کل: ${rows.length}`;
        document.getElementById('controlPanel').style.display = 'block';
        updateUI();
    });

    function updateUI() {
        const totalChunks = Math.ceil(rows.length / CHUNK_SIZE);
        const currentPart = Math.floor(currentIndex / CHUNK_SIZE) + 1;
        document.getElementById('progressText').innerText = `بخش ${currentPart} از ${totalChunks}`;
        
        const progress = (currentIndex / rows.length) * 100;
        document.getElementById('progressBar').style.width = `${progress}%`;

        const end = Math.min(currentIndex + CHUNK_SIZE, rows.length);
        document.getElementById('copyBtn').innerText = `کپی ردیف ${currentIndex + 1} تا ${end}`;
        
        const sample = rows.slice(currentIndex, currentIndex + 2).join(', ');
        document.getElementById('preview').innerText = `آماده: ${sample}...`;
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
        const end = Math.min(currentIndex + CHUNK_SIZE, rows.length);
        const chunk = rows.slice(currentIndex, end).join('\n');

        navigator.clipboard.writeText(chunk).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✅";
            btn.classList.add('copied');

            setTimeout(() => {
                btn.classList.remove('copied');
                if (end < rows.length) {
                    currentIndex += CHUNK_SIZE;
                    // ذخیره در حافظه گوشی
                    localStorage.setItem('excel_index', currentIndex);
                    updateUI();
                } else {
                    btn.innerText = "پایان فایل 🎉";
                    localStorage.removeItem('excel_index');
                }
            }, 1000);
        });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm("آیا مطمئن هستید که می‌خواهید تمام پیشرفت‌ها پاک شود؟")) {
            localStorage.removeItem('excel_index');
            location.reload();
        }
    });
</script>

</body>
</html>
