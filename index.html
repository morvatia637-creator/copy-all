<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro v10</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #6366f1; --success: #10b981; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .upload-card { border: 2px dashed #334155; border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 15px; position: relative; }
        .upload-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        select { width: 100%; padding: 12px; background: #0f172a; color: white; border-radius: 10px; border: 1px solid #334155; margin-bottom: 10px; font-size: 13px; }
        .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .log { background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 10px; margin-top: 15px; text-align: left; direction: ltr; min-height: 50px; }
        h2 { text-align: center; font-size: 20px; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h2>ادغام اکسل (Vlookup ساده)</h2>
    
    <div class="upload-card">📁 فایل اول (پایه)<input type="file" id="fA"></div>
    <select id="sA" style="display:none"></select>

    <div class="upload-card">📁 فایل دوم (مرجع)<input type="file" id="fB"></div>
    <select id="sB" style="display:none"></select>
    <span style="font-size:11px">ستون شماره تلفن در فایل دوم:</span>
    <select id="sP" style="display:none"></select>

    <button id="go" class="btn" style="display:none">🧬 شروع ادغام</button>
    <div id="log" class="log">منتظر فایل‌ها...</div>
</div>

<script>
    let dA = null, dB = null;

    // استانداردسازی شماره موبایل (فقط 09...)
    function fixPhone(v) {
        if (!v) return null;
        let s = String(v).replace(/\D/g, '');
        if (s.length < 10) return null;
        return '0' + s.slice(-10);
    }

    // خواندن فایل
    async function read(e, type) {
        const f = e.target.files[0];
        const wb = XLSX.read(await f.arrayBuffer());
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
        if (type === 'A') {
            dA = json; fill(json[0], 'sA');
        } else {
            dB = json; fill(json[0], 'sB'); fill(json[0], 'sP');
        }
        if (dA && dB) document.getElementById('go').style.display = 'block';
        document.getElementById('log').innerText = `فایل ${type === 'A' ? 'اول' : 'دوم'} بارگذاری شد.`;
    }

    function fill(h, id) {
        const s = document.getElementById(id);
        s.style.display = 'block';
        s.innerHTML = '<option value="">انتخاب ستون...</option>';
        h.forEach((n, i) => s.innerHTML += `<option value="${i}">${n || i}</option>`);
    }

    document.getElementById('fA').onchange = (e) => read(e, 'A');
    document.getElementById('fB').onchange = (e) => read(e, 'B');

    document.getElementById('go').onclick = () => {
        const kA = document.getElementById('sA').value, kB = document.getElementById('sB').value, pB = document.getElementById('sP').value;
        if (!kA || !kB || !pB) return alert("همه ستون‌ها را انتخاب کنید");

        const log = document.getElementById('log');
        log.innerText = "در حال پردازش...";

        setTimeout(() => {
            const mapB = new Map();
            const hB = dB[0];
            
            // ستون‌های حذفی: ستون جستجو و ستونی که نامش "ردیف" است
            const keepB = hB.map((h, i) => (i != kB && String(h).trim() !== "ردیف") ? i : -1).filter(i => i !== -1);

            // ۱. ساختن لیست جستجو از فایل دوم (فقط ردیف‌هایی که شماره معتبر دارند)
            dB.slice(1).forEach(row => {
                const phone = fixPhone(row[pB]);
                const key = String(row[kB] || "").trim(); // جستجوی خام متنی
                if (key && phone) {
                    const cleanRow = [...row];
                    cleanRow[pB] = phone; // جایگزینی شماره استاندارد
                    mapB.set(key, cleanRow);
                }
            });

            // ۲. پیدا کردن در فایل اول و ادغام
            const hA = dA[0];
            const finalH = [...hA, ...keepB.map(i => hB[i])];
            const result = [finalH];
            let found = 0;

            dA.slice(1).forEach(rowA => {
                const keyA = String(rowA[kA] || "").trim();
                const match = mapB.get(keyA);
                if (match) {
                    const rowBase = Array.from({length: hA.length}, (_, i) => rowA[i] || "");
                    const rowExtra = keepB.map(i => match[i]);
                    result.push([...rowBase, ...rowExtra]);
                    found++;
                }
            });

            if (found > 0) {
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(result), "Result");
                XLSX.writeFile(wb, "Merged_Data.xlsx");
                log.innerText = `✅ تمام شد! ${found} ردیف ادغام و دانلود شد.`;
            } else {
                log.innerText = "❌ هیچ تطابقی پیدا نشد. ستون‌ها را چک کنید.";
            }
        }, 200);
    };
</script>
</body>
</html>
