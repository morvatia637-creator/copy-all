<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro Master - دستیار کپی هوشمند</title>
    <!-- بارگذاری فونت زیبای وزیر و کتابخانه اکسل -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #818cf8;
            --primary-dark: #6366f1;
            --accent: #c084fc;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 26px;
            margin: 0;
            background: linear-gradient(to left, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        header p { color: #94a3b8; font-size: 13px; margin-top: 5px; }

        /* بخش آپلود */
        .upload-section {
            margin: 25px 0;
            border: 2px dashed #334155;
            border-radius: 20px;
            padding: 40px 20px;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(15, 23, 42, 0.4);
        }
        .upload-section:active { transform: scale(0.98); border-color: var(--primary); }
        .upload-section input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 45px; display: block; margin-bottom: 10px; }

        /* انتخابگرها */
        select {
            width: 100%;
            padding: 14px;
            background: #1e293b;
            border: 1px solid var(--border);
            color: white;
            border-radius: 14px;
            font-family: 'Vazirmatn';
            font-size: 15px;
            outline: none;
            margin-top: 15px;
        }

        /* پنل کنترل */
        .control-panel { display: none; margin-top: 25px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .progress-info { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 8px; }
        .bar-bg { background: #334155; height: 12px; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        .btn-copy {
            background: linear-gradient(135deg, var(--primary-dark), var(--accent));
            color: white; border: none; width: 100%; padding: 18px; border-radius: 18px;
            font-size: 17px; font-weight: bold; cursor: pointer; font-family: 'Vazirmatn';
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); transition: 0.3s;
        }
        .btn-copy:active { transform: scale(0.96); box-shadow: none; }
        .btn-copy.success { background: var(--success); }

        .preview-area {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px; padding: 15px; margin-top: 20px;
            font-size: 12px; border-right: 4px solid var(--primary); color: #94a3b8;
            max-height: 80px; overflow: hidden;
        }

        /* دکمه‌های ابزار */
        .tools { display: flex; gap: 10px; margin-top: 20px; }
        .btn-tool {
            flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border);
            background: transparent; color: #f1f5f9; font-family: 'Vazirmatn'; font-size: 12px; cursor: pointer;
        }
        .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }

        /* فوتر و توسعه‌دهنده */
        footer { text-align: center; margin-top: auto; padding: 20px; width: 100%; }
        .dev-card {
            display: inline-flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.05); padding: 8px 20px; border-radius: 100px;
            font-size: 12px; color: #94a3b8; border: 1px solid var(--border);
        }
        .dev-card b { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Excel Pro Master</h1>
        <p>استخراج هوشمند داده‌ها در بسته‌های ۷۰۰۰تایی</p>
    </header>

    <!-- بخش آپلود -->
    <div id="uploadWrapper">
        <div class="upload-section">
            <span class="upload-icon">📂</span>
            <span id="fileStatus">فایل اکسل را انتخاب یا اینجا رها کنید</span>
            <input type="file" id="fileInput" accept=".xlsx, .xls">
        </div>
        <div id="resumeTip" style="display:none; font-size: 11px; color: var(--accent); text-align: center;">
             🔄 حافظه فعال: آماده ادامه از ردیف <span id="savedRow">0</span>
        </div>
    </div>

    <!-- مرحله انتخاب ستون -->
    <div id="selectionStep" style="display:none;">
        <select id="columnSelect"></select>
    </div>

    <!-- مرحله کپی و کنترل -->
    <div id="controlPanel" class="control-panel">
        <div class="progress-info">
            <span id="chunkInfo">بخش ۱ از ۱</span>
            <span id="totalInfo">کل: ۰ ردیف</span>
        </div>
        <div class="bar-bg"><div id="progressBar" class="bar-fill"></div></div>
        
        <button id="copyBtn" class="btn-copy">کپی ۷۰۰۰ تای اول</button>
        
        <div class="preview-area" id="previewBox">
            در انتظار انتخاب ستون...
        </div>

        <div class="tools">
            <button class="btn-tool btn-danger" id="deleteFile">❌ حذف فایل و شروع مجدد</button>
        </div>
    </div>
</div>

<footer>
    <div class="dev-card">
        توسعه داده شده توسط: <b>سایبری لرستان</b>
    </div>
</footer>

<script>
    let fullRows = [];
    let currentIndex = 0;
    const CHUNK = 7000;

    // بارگذاری حافظه
    window.onload = () => {
        const saved = localStorage.getItem('last_idx');
        if (saved && parseInt(saved) > 0) {
            document.getElementById('resumeTip').style.display = 'block';
            document.getElementById('savedRow').innerText = parseInt(saved) + 1;
            currentIndex = parseInt(saved);
        }
    };

    // هندل آپلود فایل
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('fileStatus').innerHTML = `در حال تحلیل <b>${file.name}</b>...`;
        
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {header: 1});

        window.rawJson = json;
        const headers = json[0];
        
        const select = document.getElementById('columnSelect');
        select.innerHTML = '<option value="">🎯 انتخاب ستون برای استخراج...</option>';
        headers.forEach((h, i) => {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = h || `ستون ${i+1}`;
            select.appendChild(opt);
        });

        document.getElementById('uploadWrapper').style.display = 'none';
        document.getElementById('selectionStep').style.display = 'block';
    });

    // هندل انتخاب ستون
    document.getElementById('columnSelect').addEventListener('change', function() {
        const colIdx = this.value;
        if (!colIdx) return;

        fullRows = window.rawJson.slice(1).map(r => r[colIdx]).filter(c => c !== undefined && c !== "");
        
        if (currentIndex >= fullRows.length) currentIndex = 0;

        document.getElementById('selectionStep').style.display = 'none';
        document.getElementById('controlPanel').style.display = 'block';
        document.getElementById('totalInfo').innerText = `کل: ${fullRows.length} ردیف`;
        updateUI();
    });

    function updateUI() {
        const totalParts = Math.ceil(fullRows.length / CHUNK);
        const currentPart = Math.floor(currentIndex / CHUNK) + 1;
        document.getElementById('chunkInfo').innerText = `بخش ${currentPart} از ${totalParts}`;
        
        const perc = (currentIndex / fullRows.length) * 100;
        document.getElementById('progressBar').style.width = `${perc}%`;

        const end = Math.min(currentIndex + CHUNK, fullRows.length);
        document.getElementById('copyBtn').innerText = `📋 کپی ردیف ${currentIndex + 1} تا ${end}`;
        
        const preview = fullRows.slice(currentIndex, currentIndex + 2).join(' | ');
        document.getElementById('previewBox').innerText = `آماده سازی محتوا: ${preview}...`;
    }

    // عملیات کپی
    document.getElementById('copyBtn').addEventListener('click', () => {
        const end = Math.min(currentIndex + CHUNK, fullRows.length);
        const textToCopy = fullRows.slice(currentIndex, end).join('\n');

        navigator.clipboard.writeText(textToCopy).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✅";
            btn.classList.add('success');

            setTimeout(() => {
                btn.classList.remove('success');
                if (end < fullRows.length) {
                    currentIndex += CHUNK;
                    localStorage.setItem('last_idx', currentIndex);
                    updateUI();
                } else {
                    btn.innerText = "تمام ردیف‌ها کپی شدند 🎉";
                    localStorage.removeItem('last_idx');
                }
            }, 1000);
        });
    });

    // دکمه حذف فایل و بازنشانی
    document.getElementById('deleteFile').addEventListener('click', () => {
        if(confirm("آیا فایل فعلی حذف شود و به منوی آپلود بازگردید؟")) {
            localStorage.removeItem('last_idx');
            location.reload();
        }
    });
</script>

</body>
</html>
