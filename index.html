<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Multi-Tool | کپی و ادغام هوشمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #818cf8; --primary-dark: #6366f1; --accent: #c084fc;
            --success: #10b981; --danger: #ef4444; --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.85); --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Vazirmatn', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px;
        }

        .container { width: 100%; max-width: 500px; background: var(--glass); backdrop-filter: blur(16px); border-radius: 32px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

        /* تب‌ها */
        .tabs { display: flex; gap: 5px; background: rgba(15, 23, 42, 0.5); padding: 5px; border-radius: 16px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 12px; background: transparent; color: #94a3b8; cursor: pointer; font-family: 'Vazirmatn'; font-size: 13px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        header h1 { font-size: 22px; margin: 0; background: linear-gradient(to left, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; text-align: center; }
        
        /* باکس‌های آپلود و پیام */
        .upload-card { background: rgba(15, 23, 42, 0.4); border: 2px dashed #334155; border-radius: 20px; padding: 25px; margin: 15px 0; text-align: center; position: relative; transition: 0.3s; }
        .upload-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-card.loaded { border-color: var(--success); border-style: solid; background: rgba(16, 185, 129, 0.05); }

        select { width: 100%; padding: 12px; background: #1e293b; border: 1px solid var(--border); color: white; border-radius: 12px; font-family: 'Vazirmatn'; margin-top: 10px; outline: none; font-size: 13px; }

        .main-btn { background: linear-gradient(135deg, var(--primary-dark), var(--accent)); color: white; border: none; width: 100%; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: 'Vazirmatn'; margin-top: 15px; transition: 0.3s; }
        .main-btn:active { transform: scale(0.97); }
        .main-btn.success { background: var(--success); }

        /* نوار پیشرفت */
        .bar-bg { background: #334155; height: 10px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .bar-fill { height: 100%; width: 0%; background: var(--primary); transition: 0.4s; }

        .resume-banner { background: rgba(99, 102, 241, 0.1); border: 1px dashed var(--primary); border-radius: 12px; padding: 12px; margin-bottom: 15px; font-size: 11px; line-height: 1.6; }

        footer { text-align: center; margin-top: 20px; font-size: 11px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Excel Multi-Tool</h1>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('copyTab')">🚀 کپی ۷۰۰۰ تایی</button>
        <button class="tab-btn" onclick="openTab('mergeTab')">🔗 ادغام (VLOOKUP)</button>
    </div>

    <!-- تب کپی ۷۰۰۰ تایی -->
    <div id="copyTab" class="tab-content active">
        <div id="resumeBanner" class="resume-banner" style="display:none;">
            ⏳ <b>بازیابی هوشمند:</b> صفحه رفرش شده. فایل را آپلود کنید تا از <b>ردیف <span id="savedRow">0</span></b> ادامه دهید.
        </div>
        
        <div class="upload-card" id="copyUploadCard">
            <span style="font-size: 30px;">📂</span>
            <p id="copyFileStatus">انتخاب فایل اکسل</p>
            <input type="file" id="copyFileInput" accept=".xlsx, .xls">
        </div>

        <div id="copyStep2" style="display:none;">
            <select id="copyColumnSelect"></select>
            <div id="copyControls" style="display:none; margin-top: 20px;">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px;">
                    <span id="copyPartInfo">بخش ۱</span>
                    <span id="copyTotalInfo">کل: ۰</span>
                </div>
                <div class="bar-bg"><div id="copyProgressBar" class="bar-fill"></div></div>
                <button id="copyBtn" class="main-btn">📋 کپی ردیف‌های اول</button>
                <button onclick="location.reload()" style="background:transparent; color:var(--danger); border:none; font-size:11px; width:100%; margin-top:15px; cursor:pointer;">❌ حذف و بازنشانی</button>
            </div>
        </div>
    </div>

    <!-- تب ادغام -->
    <div id="mergeTab" class="tab-content">
        <p style="font-size: 11px; color: #94a3b8; text-align: center;">دو فایل را آپلود کرده و بر اساس یک ستون مشترک ادغام کنید.</p>
        
        <div class="upload-card" id="cardA">
            <p id="statusA">📁 انتخاب فایل اول (پایه)</p>
            <input type="file" id="fileA" accept=".xlsx, .xls">
        </div>
        <select id="colA" style="display:none;"></select>

        <div class="upload-card" id="cardB">
            <p id="statusB">📁 انتخاب فایل دوم (مرجع)</p>
            <input type="file" id="fileB" accept=".xlsx, .xls">
        </div>
        <select id="colB" style="display:none;"></select>

        <button id="mergeBtn" class="main-btn" style="display:none;">🧬 شروع ادغام و دانلود</button>
        <p id="mergeStatus" style="font-size:11px; color:var(--success); text-align:center; margin-top:10px;"></p>
    </div>
</div>

<footer>
    طراحی و توسعه برای استفاده حرفه‌ای در موبایل
</footer>

<script>
    // --- مدیریت تب‌ها ---
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- بخش کپی ۷۰۰۰ تایی ---
    let copyRows = [];
    let copyIdx = 0;
    const CHUNK = 7000;

    window.onload = () => {
        const saved = localStorage.getItem('copy_idx');
        if (saved && parseInt(saved) > 0) {
            document.getElementById('resumeBanner').style.display = 'block';
            document.getElementById('savedRow').innerText = parseInt(saved) + 1;
            copyIdx = parseInt(saved);
        }
    };

    document.getElementById('copyFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('copyFileStatus').innerText = file.name;
        document.getElementById('copyUploadCard').classList.add('loaded');
        
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
        window.copyRaw = json;

        const select = document.getElementById('copyColumnSelect');
        select.innerHTML = '<option value="">🎯 انتخاب ستون هدف...</option>';
        json[0].forEach((h, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = h || `ستون ${i+1}`;
            select.appendChild(opt);
        });
        document.getElementById('copyStep2').style.display = 'block';
    });

    document.getElementById('copyColumnSelect').addEventListener('change', function() {
        if (!this.value) return;
        copyRows = window.copyRaw.slice(1).map(r => r[this.value]).filter(c => c);
        document.getElementById('copyControls').style.display = 'block';
        updateCopyUI();
    });

    function updateCopyUI() {
        const total = Math.ceil(copyRows.length / CHUNK);
        const current = Math.floor(copyIdx / CHUNK) + 1;
        document.getElementById('copyPartInfo').innerText = `بخش ${current} از ${total}`;
        document.getElementById('copyTotalInfo').innerText = `کل: ${copyRows.length}`;
        document.getElementById('copyProgressBar').style.width = `${(copyIdx / copyRows.length) * 100}%`;
        const end = Math.min(copyIdx + CHUNK, copyRows.length);
        document.getElementById('copyBtn').innerText = `📋 کپی ردیف ${copyIdx+1} تا ${end}`;
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
        const end = Math.min(copyIdx + CHUNK, copyRows.length);
        const text = copyRows.slice(copyIdx, end).join('\n');
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✅";
            setTimeout(() => {
                if (end < copyRows.length) {
                    copyIdx += CHUNK;
                    localStorage.setItem('copy_idx', copyIdx);
                    updateCopyUI();
                } else {
                    btn.innerText = "تمام شد 🎉";
                    localStorage.removeItem('copy_idx');
                }
            }, 800);
        });
    });

    // --- بخش ادغام (VLOOKUP) ---
    let dataA = [], dataB = [];

    async function handleFile(e, statusId, cardId, selectId) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById(statusId).innerText = file.name;
        document.getElementById(cardId).classList.add('loaded');
        
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
        
        const select = document.getElementById(selectId);
        select.innerHTML = '<option value="">🔑 انتخاب ستون کلید...</option>';
        json[0].forEach((h, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = h || `ستون ${i+1}`;
            select.appendChild(opt);
        });
        select.style.display = 'block';
        checkMergeReady();
        return json;
    }

    document.getElementById('fileA').addEventListener('change', async (e) => { dataA = await handleFile(e, 'statusA', 'cardA', 'colA'); });
    document.getElementById('fileB').addEventListener('change', async (e) => { dataB = await handleFile(e, 'statusB', 'cardB', 'colB'); });

    function checkMergeReady() {
        if (dataA.length > 0 && dataB.length > 0) document.getElementById('mergeBtn').style.display = 'block';
    }

    document.getElementById('mergeBtn').addEventListener('click', () => {
        const keyA = document.getElementById('colA').value;
        const keyB = document.getElementById('colB').value;
        const status = document.getElementById('mergeStatus');

        if (keyA === "" || keyB === "") { alert("لطفاً ستون‌های کلید را انتخاب کنید."); return; }

        status.innerText = "⏳ در حال ادغام... لطفاً صبور باشید.";

        // تبدیل فایل دوم به نقشه (Map) برای سرعت بالا
        const mapB = new Map();
        const headersB = dataB[0];
        dataB.slice(1).forEach(row => {
            if (row[keyB]) mapB.set(String(row[keyB]).trim(), row);
        });

        // ادغام
        const mergedData = [];
        const headersA = dataA[0];
        // هدر جدید = هدر فایل اول + هدر فایل دوم
        mergedData.push([...headersA, ...headersB]);

        dataA.slice(1).forEach(rowA => {
            const valA = String(rowA[keyA] || "").trim();
            const rowB = mapB.get(valA);
            if (rowB) {
                mergedData.push([...rowA, ...rowB]);
            } else {
                // اگر پیدا نشد، ردیف اول را می‌نویسد و بقیه را خالی می‌گذارد
                mergedData.push([...rowA, ...new Array(headersB.length).fill("")]);
            }
        });

        // ساخت اکسل جدید
        const newWb = XLSX.utils.book_new();
        const newWs = XLSX.utils.aoa_to_sheet(mergedData);
        XLSX.utils.book_append_sheet(newWb, newWs, "MergedResult");
        XLSX.writeFile(newWb, "Merged_File.xlsx");

        status.innerText = "✅ فایل با موفقیت ادغام و دانلود شد.";
    });
</script>

</body>
</html>
