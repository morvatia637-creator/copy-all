<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro Master v7</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #818cf8; --success: #10b981; --danger: #ef4444; --bg: #0f172a; --glass: rgba(30, 41, 59, 0.85); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background: #0f172a; color: #f1f5f9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 500px; background: var(--glass); backdrop-filter: blur(16px); border-radius: 24px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .tabs { display: flex; gap: 8px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        header h1 { font-size: 22px; text-align: center; margin: 0 0 15px; color: var(--primary); }
        .upload-card { background: rgba(255,255,255,0.03); border: 2px dashed #334155; border-radius: 15px; padding: 20px; text-align: center; position: relative; margin-bottom: 10px; }
        .upload-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-card.loaded { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }
        select { width: 100%; padding: 10px; background: #1e293b; border: 1px solid var(--border); color: white; border-radius: 10px; margin: 5px 0; outline: none; font-size: 13px; }
        .main-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .main-btn:active { transform: scale(0.98); }
        .log-box { background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; border-radius: 10px; margin-top: 15px; max-height: 150px; overflow-y: auto; text-align: left; direction: ltr; }
        .label-sm { font-size: 11px; color: var(--primary); margin-top: 8px; display: block; }
        footer { margin-top: 20px; font-size: 10px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Excel Multi-Tool v7</h1></header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('copyTab')">🚀 کپی ۷۰۰۰ تایی</button>
        <button class="tab-btn" onclick="switchTab('mergeTab')">🔗 ادغام هوشمند</button>
    </div>

    <!-- تب کپی -->
    <div id="copyTab" class="tab-content active">
        <div class="upload-card" id="copyCard">📁 <span id="copyStatus">انتخاب فایل اصلی</span><input type="file" id="copyFile" accept=".xlsx, .xls"></div>
        <div id="copyStep2" style="display:none;">
            <select id="copyColSelect"></select>
            <button id="copyBtn" class="main-btn">📋 کپی ردیف‌های هدف</button>
        </div>
    </div>

    <!-- تب ادغام -->
    <div id="mergeTab" class="tab-content">
        <div class="upload-card" id="cardA">📁 <span id="statusA">فایل اول (پایه)</span><input type="file" id="fileA" accept=".xlsx, .xls"></div>
        <select id="colA" style="display:none;"></select>
        
        <div class="upload-card" id="cardB" style="margin-top:15px;">📁 <span id="statusB">فایل دوم (مرجع)</span><input type="file" id="fileB" accept=".xlsx, .xls"></div>
        <select id="colB" style="display:none;"></select>
        <span id="lblPhoneB" class="label-sm" style="display:none;">ستون شماره تلفن در فایل دوم:</span>
        <select id="colPhoneB" style="display:none;"></select>
        
        <button id="mergeBtn" class="main-btn" style="display:none;">🧬 شروع عملیات ادغام</button>
        <div id="debugLog" class="log-box" style="display:none;"></div>
    </div>
</div>

<footer>طراحی شده برای مدیریت حرفه‌ای داده‌ها</footer>

<script>
    function switchTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // استانداردسازی شماره موبایل (منعطف)
    function cleanPhone(val) {
        if (!val) return null;
        let str = String(val).replace(/\D/g, ''); // فقط اعداد
        if (str.length < 10) return null;
        let main = str.slice(-10); // ۱۰ رقم آخر
        if (main.startsWith('9')) return '0' + main;
        return null;
    }

    // استانداردسازی کلید برای جستجو (بسیار مهم)
    function cleanKey(val) {
        if (val === undefined || val === null) return "";
        return String(val).trim().toLowerCase();
    }

    function addLog(msg) {
        const log = document.getElementById('debugLog');
        log.style.display = 'block';
        log.innerHTML += "> " + msg + "<br>";
        log.scrollTop = log.scrollHeight;
    }

    // --- کپی ۷۰۰۰ تایی ---
    document.getElementById('copyFile').addEventListener('change', async (e) => {
        const wb = XLSX.read(await e.target.files[0].arrayBuffer());
        window.cData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
        const sel = document.getElementById('copyColSelect');
        sel.innerHTML = '<option value="">--- انتخاب ستون ---</option>';
        window.cData[0].forEach((h, i) => { sel.innerHTML += `<option value="${i}">${h || 'ستون '+(i+1)}</option>`; });
        document.getElementById('copyStep2').style.display='block';
    });

    // --- ادغام (VLOOKUP) ---
    let dA = null, dB = null;
    async function loadFile(e, stId, cardId, type) {
        const file = e.target.files[0];
        const wb = XLSX.read(await file.arrayBuffer());
        const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1});
        if(type === 'A') { dA = json; fillS('colA', json[0]); }
        else { dB = json; fillS('colB', json[0]); fillS('colPhoneB', json[0]); document.getElementById('lblPhoneB').style.display='block'; }
        document.getElementById(stId).innerText = "✅ " + file.name;
        document.getElementById(cardId).classList.add('loaded');
        if(dA && dB) document.getElementById('mergeBtn').style.display='block';
    }
    function fillS(id, h) {
        const s = document.getElementById(id); s.style.display='block';
        s.innerHTML = '<option value="">--- انتخاب ستون ---</option>';
        h.forEach((n, i) => { s.innerHTML += `<option value="${i}">${n || 'ستون '+(i+1)}</option>`; });
    }
    document.getElementById('fileA').addEventListener('change', (e) => loadFile(e, 'statusA', 'cardA', 'A'));
    document.getElementById('fileB').addEventListener('change', (e) => loadFile(e, 'statusB', 'cardB', 'B'));

    document.getElementById('mergeBtn').addEventListener('click', () => {
        const kA = document.getElementById('colA').value, kB = document.getElementById('colB').value, pB = document.getElementById('colPhoneB').value;
        if (kA==="" || kB==="" || pB==="") return alert("لطفاً ستون‌ها را انتخاب کنید.");

        document.getElementById('debugLog').innerHTML = "";
        addLog("شروع پردازش...");

        setTimeout(() => {
            try {
                const mapB = new Map();
                const headersB = dB[0];
                let validPhones = 0;

                // ۱. تحلیل فایل مرجع
                dB.slice(1).forEach((row, idx) => {
                    const phone = cleanPhone(row[pB]);
                    const key = cleanKey(row[kB]);
                    if (key && phone) {
                        const newRow = [...row];
                        newRow[pB] = phone; // جایگزینی شماره استاندارد
                        mapB.set(key, newRow);
                        validPhones++;
                    }
                });
                addLog(`فایل دوم تحلیل شد. شماره‌های معتبر پیدا شده: ${validPhones}`);

                // ۲. ادغام با فایل پایه
                const headersA = dA[0];
                const finalResult = [[...headersA, ...headersB]];
                let matches = 0;

                dA.slice(1).forEach((rowA) => {
                    // تراز کردن طول ردیف A
                    const baseRow = Array.from({length: headersA.length}, (_, i) => rowA[i] !== undefined ? rowA[i] : "");
                    const keyA = cleanKey(rowA[kA]);
                    const matchData = mapB.get(keyA);

                    if (matchData) {
                        finalResult.push([...baseRow, ...matchData]);
                        matches++;
                    } else {
                        finalResult.push([...baseRow, ...new Array(headersB.length).fill("")]);
                    }
                });

                addLog(`عملیات تمام شد. تعداد موارد تطبیق داده شده: ${matches}`);

                if (matches === 0) {
                    addLog("⚠️ هشدار: هیچ موردی پیدا نشد. مطمئن شوید ستون‌های کلید در هر دو فایل یکسان هستند.");
                } else {
                    const nWb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(nWb, XLSX.utils.aoa_to_sheet(finalResult), "Output");
                    XLSX.writeFile(nWb, "Merged_Result.xlsx");
                    addLog("✅ فایل آماده دانلود شد.");
                }

            } catch (err) {
                addLog("❌ خطا: " + err.message);
            }
        }, 300);
    });
</script>
</body>
</html>
