<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Pro Master | پاکساز و کپی هوشمند</title>
    <link href="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js" rel="preload" as="script">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #818cf8; --primary-dark: #6366f1; --accent: #c084fc;
            --success: #10b981; --danger: #ef4444; --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.85); --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Vazirmatn', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: #f1f5f9; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px;
        }

        .container { width: 100%; max-width: 480px; background: var(--glass); backdrop-filter: blur(20px); border-radius: 32px; padding: 25px; border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); margin-bottom: 20px; }

        header h1 { font-size: 24px; margin: 0; background: linear-gradient(to left, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; text-align: center; }
        header p { color: #94a3b8; font-size: 13px; text-align: center; margin-top: 5px; }

        /* بخش تنظیمات جدید */
        .config-panel { background: rgba(15, 23, 42, 0.5); border-radius: 18px; padding: 15px; margin: 20px 0; border: 1px solid var(--border); }
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .config-row label { font-size: 12px; color: #cbd5e1; }
        .config-row input, .config-row select { background: #0f172a; border: 1px solid #334155; color: white; padding: 5px 10px; border-radius: 8px; font-family: 'Vazirmatn'; font-size: 12px; outline: none; }

        .upload-section { border: 2px dashed #334155; border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; position: relative; transition: 0.3s; }
        .upload-section:active { border-color: var(--primary); }
        .upload-section input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .control-panel { display: none; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .progress-bar-bg { background: #334155; height: 12px; border-radius: 10px; overflow: hidden; margin: 15px 0; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: 0.5s ease; }

        .btn-copy { background: linear-gradient(135deg, var(--primary-dark), var(--accent)); color: white; border: none; width: 100%; padding: 18px; border-radius: 18px; font-size: 17px; font-weight: bold; cursor: pointer; font-family: 'Vazirmatn'; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
        .btn-copy.success { background: var(--success); }

        .report-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; padding: 10px; font-size: 11px; margin-top: 15px; color: #10b981; display: none; }

        footer { text-align: center; padding: 20px; font-size: 12px; color: #64748b; }
        footer b { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Excel Phone Pro</h1>
        <p>پاکساز شماره و کپی هوشمند</p>
    </header>

    <!-- پنل تنظیمات -->
    <div class="config-panel">
        <div class="config-row">
            <label>استانداردسازی شماره موبایل (0912...)</label>
            <select id="fixPhone">
                <option value="yes">✅ بله (فقط موبایل)</option>
                <option value="no">❌ خیر (عین متن)</option>
            </select>
        </div>
        <div class="config-row">
            <label>تعداد ردیف در هر کپی:</label>
            <input type="number" id="chunkSize" value="7000" style="width: 70px;">
        </div>
    </div>

    <!-- بخش آپلود -->
    <div class="upload-section" id="uploadArea">
        <span style="font-size: 40px; display: block; margin-bottom: 10px;">📊</span>
        <span id="fileStatus">آپلود فایل اکسل</span>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <!-- انتخاب ستون -->
    <div id="selectionStep" style="display:none; margin-top: 20px;">
        <select id="columnSelect" style="width: 100%; padding: 12px; border-radius: 12px; background: #1e293b; color: white; font-family: 'Vazirmatn';"></select>
    </div>

    <!-- پنل کنترل -->
    <div id="controlPanel" class="control-panel">
        <div id="reportBox" class="report-box"></div>
        
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-top: 15px;">
            <span id="chunkInfo">بخش ۱</span>
            <span id="totalInfo">کل: ۰ شماره</span>
        </div>
        <div class="progress-bar-bg"><div id="progressBar" class="progress-bar-fill"></div></div>
        
        <button id="copyBtn" class="btn-copy">کپی بسته‌ی اول</button>
        
        <button id="resetBtn" style="background: transparent; color: var(--danger); border: none; font-family: 'Vazirmatn'; width: 100%; margin-top: 20px; cursor: pointer; font-size: 12px;">❌ حذف فایل و بازنشانی</button>
    </div>
</div>

<footer>طراحی و توسعه برای استفاده شخصی | <b>نسخه حرفه‌ای</b></footer>

<script>
    let processedRows = [];
    let currentIndex = 0;

    // تابع اصلی پاکسازی شماره موبایل
    function cleanPhone(val) {
        if (!val) return null;
        let str = String(val).replace(/\D/g, ''); // فقط اعداد را نگه دار

        // حذف پیش‌شماره‌های کشور
        if (str.startsWith('98')) str = str.substring(2);
        if (str.startsWith('0098')) str = str.substring(4);

        // اگر ۱۰ رقم است و با ۹ شروع می‌شود (مثلاً 912...)، یک صفر اولش بگذار
        if (str.length === 10 && str.startsWith('9')) {
            str = '0' + str;
        }

        // چک نهایی: باید ۱۱ رقم باشد و با 09 شروع شود
        if (str.length === 11 && str.startsWith('09')) {
            return str;
        }
        return null; // اگر شماره موبایل معتبر ایران نبود، حذفش کن
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileStatus').innerText = `در حال خواندن فایل...`;
        
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data);
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});

        window.rawExcel = json;
        const headers = json[0];
        const select = document.getElementById('columnSelect');
        select.innerHTML = '<option value="">🎯 انتخاب ستون شماره‌ها...</option>';
        headers.forEach((h, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = h || `ستون ${i+1}`;
            select.appendChild(opt);
        });

        document.getElementById('uploadArea').style.display = 'none';
        document.getElementById('selectionStep').style.display = 'block';
    });

    document.getElementById('columnSelect').addEventListener('change', function() {
        const colIdx = this.value;
        if (!colIdx) return;

        const rawData = window.rawExcel.slice(1).map(r => r[colIdx]);
        const shouldFix = document.getElementById('fixPhone').value === 'yes';

        let cleaned = [];
        let invalidCount = 0;

        if (shouldFix) {
            rawData.forEach(item => {
                const phone = cleanPhone(item);
                if (phone) cleaned.push(phone);
                else invalidCount++;
            });
        } else {
            cleaned = rawData.filter(c => c !== undefined && c !== "");
        }

        processedRows = cleaned;
        currentIndex = 0;

        // نمایش گزارش
        if (shouldFix) {
            const report = document.getElementById('reportBox');
            report.style.display = 'block';
            report.innerText = `✅ پردازش تمام شد: ${cleaned.length} شماره معتبر پیدا شد. (${invalidCount} مورد نامعتبر حذف شد)`;
        }

        document.getElementById('selectionStep').style.display = 'none';
        document.getElementById('controlPanel').style.display = 'block';
        document.getElementById('totalInfo').innerText = `کل شماره‌ها: ${processedRows.length}`;
        updateUI();
    });

    function updateUI() {
        const CHUNK = parseInt(document.getElementById('chunkSize').value) || 7000;
        const totalParts = Math.ceil(processedRows.length / CHUNK);
        const currentPart = Math.floor(currentIndex / CHUNK) + 1;
        
        document.getElementById('chunkInfo').innerText = `بخش ${currentPart} از ${totalParts}`;
        const perc = (currentIndex / processedRows.length) * 100;
        document.getElementById('progressBar').style.width = `${perc}%`;

        const end = Math.min(currentIndex + CHUNK, processedRows.length);
        document.getElementById('copyBtn').innerText = `📋 کپی ردیف ${currentIndex + 1} تا ${end}`;
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
        const CHUNK = parseInt(document.getElementById('chunkSize').value) || 7000;
        const end = Math.min(currentIndex + CHUNK, processedRows.length);
        const text = processedRows.slice(currentIndex, end).join('\n');

        navigator.clipboard.writeText(text).then(() => {
            if (navigator.vibrate) navigator.vibrate(50);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "کپی شد! ✅";
            btn.classList.add('success');

            setTimeout(() => {
                btn.classList.remove('success');
                if (end < processedRows.length) {
                    currentIndex += CHUNK;
                    updateUI();
                } else {
                    btn.innerText = "پایان فایل 🎉";
                }
            }, 1000);
        });
    });

    document.getElementById('resetBtn').addEventListener('click', () => { location.reload(); });
</script>

</body>
</html>
